name: Bootstrap generated finalization

on:
  push:
    branches:
      - agent/generated-finalization
    paths:
      - .github/bootstrap_payload.txt
      - .github/bootstrap_payload.*
      - .github/workflows/bootstrap-generated-finalization.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-generated-finalization
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Reassemble and apply the reviewed repository transformation
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          import zlib
          parts = sorted(Path(".github").glob("bootstrap_payload.[0-9][0-9]"))
          if len(parts) != 6:
              raise SystemExit(f"expected 6 bootstrap payload chunks, found {len(parts)}")
          payload = b"".join(path.read_bytes() for path in parts)
          Path(".github/bootstrap_generated_finalization.py").write_bytes(
              zlib.decompress(base64.b64decode(payload, validate=True))
          )
          PY
          set +e
          python .github/bootstrap_generated_finalization.py 2>&1 | tee /tmp/bootstrap.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/bootstrap.log .github/bootstrap_error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/bootstrap_error.txt
            git commit -m "chore: capture bootstrap failure"
            git push origin HEAD:${GITHUB_REF_NAME}
            exit "$status"
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/change_impact.py")
          text = path.read_text(encoding="utf-8")
          old = 'if value["schema_version"] != 3:\n        raise ValueError("Unsupported change-impact policy schema")'
          new = 'if value["schema_version"] != 4:\n        raise ValueError("Unsupported change-impact policy schema")'
          if old not in text:
              raise SystemExit("change-impact schema guard was not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
      - name: Remove one-time bootstrap files before generation
        run: |
          rm -f .github/bootstrap_payload.txt .github/bootstrap_payload.[0-9][0-9]
          rm .github/bootstrap_generated_finalization.py
          rm .github/workflows/bootstrap-generated-finalization.yml
          rm -f .github/bootstrap_error.txt
      - name: Install validation dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Compile changed Python surfaces
        run: >-
          python -m compileall -q
          scripts
          tests/test_generated_artifacts.py
          tests/test_platform_status.py
          tests/test_architecture_audit.py
          tests/test_quick_gate.py
          tests/test_change_impact.py
          tests/test_ci_pipeline.py
          quorune/reusable_pieces/generation.py
      - name: Finalize every automatic generated artifact
        run: python scripts/finalize_generated.py --write
      - name: Inspect deterministic impact plan
        run: python scripts/quick_gate.py --dry-run
      - name: Build compact validation database
        run: >-
          python scripts/build_test_database.py build
          --fixture tests/fixtures/scryfall-exact-lists.json
          --fixture tests/fixtures/browser-lifecycle-cards.json
          --fixture tests/fixtures/damage-result-cards.json
          --fixture tests/fixtures/draw-rules-cards.json
          --fixture tests/fixtures/counter-replacement-cards.json
          --fixture tests/fixtures/explore-cards.json
          --output data/test-ci.sqlite3
      - name: Run directly relevant governance tests
        env:
          MTG_CARD_DB: data/test-ci.sqlite3
        run: |
          python scripts/test_shards.py validate
          python scripts/test_shards.py run generated-validation
      - name: Run final policy and hygiene checks
        run: |
          python scripts/finalize_generated.py --check
          python scripts/validate_architecture.py --check
          python scripts/validate_repository.py
          git diff --check
      - name: Inspect complete coherent diff
        run: |
          git status --short
          git diff --stat
          git diff --check
      - name: Commit and push the coherent implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: centralize generated artifact finalization"
          git push origin HEAD:${GITHUB_REF_NAME}
